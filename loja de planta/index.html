<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Loja de Plantas</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>

    <header>
        <div class="container">
            <h1>Loja de Plantas</h1>

            </article>
            <article class="produto">

    <footer>
        <div class="container">

        </div>

    <button id="toggleButton">Alternar Modo Claro / Escuro</button>
